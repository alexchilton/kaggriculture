[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kagg"
version = "0.1.0"
description = "Agent for the Kaggle Kaggriculture competition"
requires-python = ">=3.11"
dependencies = [
    "kaggle-environments>=1.32.2",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3"]

[tool.setuptools.packages.find]
include = ["kagg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Almost every test here pays a JAX trace-and-compile before it asserts anything, and that cost is
# per-process, so the suite is embarrassingly parallel and barely touched by anything else. Measured
# on a 14-core box: 387s serial, 131s with `-n auto`. Add `-n0` to any command to get back a single
# process (needed for `--pdb`, and quicker when you are iterating on one test).
#: `--dist loadfile` keeps every test of a file on ONE worker. The default `--dist load` hands
#: tests out individually, so which tests share a process changes every run -- and with any
#: leaked module state that makes the RESULT change every run. Measured 2026-08-22: two
#: identical full runs disagreed on 20 tests, while the same files run together in one process
#: gave 16 failures twice, identical, and exactly the sum of running each alone.
#: `--ignore=tests/archive` switches the day-planner test surface OFF without deleting it.
#: The shipped agent replays a 720-step tape on 719 of 720 turns, so `crew.cover`,
#: `router.plan_routes` and the whole per-tile pricing layer run every turn and have their answer
#: thrown away. 35 files and 183 tests were asking questions of a component with a 1-in-720 vote.
#: Delete this one flag to collect them again; `tests/archive/README.md` says what is in there and
#: what would have to become true for it to matter.
addopts = "-n auto --dist loadfile -m 'not slow' --ignore=tests/archive"
markers = [
    # A whole test MODULE earns this mark -- via the `pytest_collection_modifyitems` hook and the
    # `SLOW_MODULES` list in `tests/conftest.py`, not a per-test decorator -- by being JAX fast-sim
    # parity, RL training, or an integration check (CEM search, replay-archive scan, arena/ladder,
    # a full episode through the reference environment). Deselected by default so the everyday run
    # stays a few-seconds inner loop; `pyproject.toml`'s `addopts` carries the `-m 'not slow'` filter.
    #
    #   pytest                 -- default: fast unit tests only, the ones that run on every edit
    #   pytest -m slow         -- only the deselected suites (parity + RL training + integration)
    #   pytest -m ''           -- everything, no filter
    #
    # Unit tests -- including ones that pin live game rules and are not fast -- must stay in the
    # default set regardless of runtime, because they are the ones that have to run on every edit.
    # See `tests/conftest.py` for which modules are marked and why.
    "slow: JAX fast-sim parity, RL training, or integration test; deselect with -m 'not slow'",
]
