[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kagg"
version = "0.1.0"
description = "Agent for the Kaggle Kaggriculture competition"
requires-python = ">=3.11"
dependencies = [
    "kaggle-environments>=1.32.2",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["kagg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: plays whole episodes; deselect with -m 'not slow'",
]
